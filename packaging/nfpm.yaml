# Builds the .deb and .rpm:  VERSION=1.2.3 nfpm pkg --packager deb|rpm --config packaging/nfpm.yaml --target dist/
# Run from the repo root after CI has prepared build/app (app files) and build/uv (uv binary).
name: gta-clipper
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: video
priority: optional
maintainer: ${MAINTAINER}
description: |
  GTA Clipper watches livestreams, detects hype moments from chat and voice,
  and turns them into captioned vertical shorts you approve from a web dashboard.
vendor: GTA Clipper
homepage: ${HOMEPAGE}
license: MIT
depends:
  - ca-certificates
recommends:
  - ffmpeg
overrides:
  deb:
    depends:
      - ca-certificates
      - ffmpeg
contents:
  - src: ./build/app/
    dst: /opt/gta-clipper/
    type: tree
  - src: ./build/uv
    dst: /opt/gta-clipper/bin/uv
    file_info: {mode: 0755}
  - src: ./packaging/linux/setup-env.sh
    dst: /opt/gta-clipper/setup-env.sh
    file_info: {mode: 0755}
  - src: ./packaging/linux/gta-clipper
    dst: /usr/bin/gta-clipper
    file_info: {mode: 0755}
  - src: ./packaging/linux/gta-clipper.service
    dst: /usr/lib/systemd/user/gta-clipper.service
  - src: ./packaging/linux/gta-clipper.desktop
    dst: /usr/share/applications/gta-clipper.desktop
  - src: ./packaging/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/gta-clipper.png
scripts:
  postinstall: ./packaging/linux/postinstall.sh
  preremove: ./packaging/linux/preremove.sh
rpm:
  signature:
    key_file: ${RPM_SIGNING_KEY_FILE}   # passphrase comes from NFPM_RPM_PASSPHRASE
